<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; height:100%; background:transparent;
    display:flex; align-items:center; justify-content:center; }
  img { width:120px; height:120px; object-fit:contain; }
</style>
</head>
<body>
  <div id="ic"></div>
  <script>
    const ic = document.getElementById('ic');
    const qs = new URLSearchParams(location.search);

    // 1. 攞天氣代碼
    async function getIconCode() {
      if (qs.get('type') === 'weather') {
        const d = parseInt(qs.get('d'), 10);       // ?d=0 今日 / 1 明日 / 2 後日
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=en');
        const data = await res.json();
        return data.weatherForecast[d].ForecastIcon; // 7日預報第 d 日
      }
      // 唔加參數 = 即時天氣
      const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en');
      const data = await res.json();
      return data.icon;
    }

    // 2. 拼天文台官方圖 URL
    (async () => {
      try {
        const code = await getIconCode();
        const img = document.createElement('img');
        img.src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${code}.png`;
        img.alt = 'weather';
        ic.appendChild(img);
      } catch (e) {
        ic.textContent = '--';
      }
    })();
  </script>
</body>
</html>
